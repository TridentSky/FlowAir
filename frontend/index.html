<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowAir</title>
  <style>
    :root {
      --bg-base: #1b1b1b;
      --bg-layer-1: #202020;
      --bg-layer-2: #272727;
      --bg-layer-3: #2f2f2f;
      --bg-elevated: #2b2b2b;

      --stroke: #313131;
      --stroke-strong: #3d3d3d;
      --stroke-subtle: #2a2a2a;

      --text-primary: #ececec;
      --text-secondary: #a6a6a6;
      --text-tertiary: #8a8a8a;
      --text-quaternary: #6e6e6e;

      --accent: #4cc2ff;
      --accent-hover: #62cbff;
      --accent-pressed: #3bb0ee;
      --accent-soft: rgba(76, 194, 255, 0.16);

      --success: #4ade80;
      --success-soft: rgba(74, 222, 128, 0.18);
      --warning: #e0b341;
      --warning-soft: rgba(224, 179, 65, 0.16);
      --warning-text: #f0cd7a;
      --danger: #ff5b5b;
      --danger-soft: rgba(255, 91, 91, 0.16);
      --danger-text: #ff9a9a;
      --note: #c7a4ff;
      --note-soft: rgba(199, 164, 255, 0.14);
      --live: #ff4d4d;

      --radius-sm: 4px;
      --radius: 6px;
      --radius-lg: 8px;

      --shadow-flyout: 0 8px 24px rgba(0, 0, 0, 0.45);

      --font-ui: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      --font-display: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'Cascadia Code', 'Cascadia Mono', 'Consolas', 'SF Mono', monospace;

      --pl-columns: 28px 92px 84px 36px minmax(200px, 2.4fr) minmax(140px, 1fr) 162px;
      --right-panel: 380px;
      --pl-gutter: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg-base);
      overflow: hidden;
    }

    button {
      font-family: var(--font-ui);
    }
    button:not(:disabled) {
      cursor: pointer;
    }

    :focus {
      outline: none;
    }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: inherit;
    }

    button, input, select, textarea {
      transition: background 0.12s ease, border-color 0.12s ease,
                  color 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease,
                  transform 0.06s ease;
    }

    button:not(:disabled):not(.btn-subtle):hover {
      filter: brightness(1.12);
    }
    button:not(:disabled):not(.btn-subtle):active {
      filter: brightness(0.95);
      transform: translateY(0.5px);
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-subtle {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-primary);
    }
    .btn-subtle:not(:disabled):hover {
      background: var(--bg-layer-2);
    }
    .btn-subtle:not(:disabled):active {
      background: var(--bg-layer-3);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    ::selection {
      background: var(--accent-soft);
      color: var(--text-primary);
    }

    ::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #4a4a4a;
      border-radius: 6px;
      border: 3px solid var(--bg-base);
      background-clip: padding-box;
      min-height: 32px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #5a5a5a;
      background-clip: padding-box;
      border: 3px solid var(--bg-base);
    }
    ::-webkit-scrollbar-corner {
      background: transparent;
    }
    * {
      scrollbar-width: thin;
      scrollbar-color: #4a4a4a transparent;
    }

    .close-button-hover:hover {
      background: var(--danger) !important;
      color: #fff !important;
    }

    .pl-find {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      background: var(--bg-layer-2);
      border-bottom: 1px solid var(--stroke);
    }
    .pl-find-icon {
      display: flex;
      align-items: center;
      color: var(--text-tertiary);
      flex-shrink: 0;
    }
    .pl-find-input {
      flex: 1;
      min-width: 0;
      height: 26px;
      padding: 0 8px;
      background: var(--bg-base);
      border: 1px solid var(--stroke-strong);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 12px;
    }
    .pl-find-input::placeholder {
      color: var(--text-quaternary);
    }
    .pl-find-input:focus {
      border-color: var(--accent);
    }
    .pl-find-count {
      flex-shrink: 0;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .pl-find-clear {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-tertiary);
    }
    .pl-find-clear:hover {
      background: var(--bg-layer-3);
      color: var(--text-primary);
    }

    @media (max-width: 1360px) {
      :root {
        --pl-columns: 24px 82px 76px 30px minmax(140px, 2.2fr) minmax(0, 1fr) 150px;
        --pl-gutter: 8px;
        --right-panel: 340px;
      }
    }
    @media (max-width: 1150px) {
      :root {
        --pl-columns: 22px 76px 70px 28px minmax(120px, 2fr) minmax(0, 0.7fr) 142px;
        --pl-gutter: 7px;
        --right-panel: 300px;
      }
    }

    .pl-head {
      display: grid;
      grid-template-columns: var(--pl-columns);
      gap: 1px;
      background: var(--stroke-subtle);
      padding: 0 1px;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .pl-head-cell {
      background: var(--bg-layer-2);
      padding: 6px var(--pl-gutter);
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      user-select: none;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
    }
    .pl-head-cell--actions {
      padding: 3px var(--pl-gutter);
      justify-content: flex-end;
    }

    .pl-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
    }

    .pl-row {
      display: grid;
      grid-template-columns: var(--pl-columns);
      gap: 1px;
      background: var(--stroke-subtle);
      padding: 0 1px;
      margin-bottom: 1px;
      cursor: pointer;
      user-select: none;
    }
    .pl-cell {
      position: relative;
      background-color: var(--bg-layer-1);
      padding: 5px var(--pl-gutter);
      font-size: 12.5px;
      line-height: 18px;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      transition: background-color 0.12s ease;
    }
    .pl-cell:first-child {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }
    .pl-cell--num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 11.5px;
      color: var(--text-secondary);
    }
    .pl-cell--type {
      justify-content: center;
      color: var(--text-secondary);
      padding-left: 0;
      padding-right: 0;
    }
    .pl-cell--name {
      font-weight: 500;
      display: block;
      line-height: 28px;
      padding-top: 0;
      padding-bottom: 0;
    }
    .pl-cell--path {
      color: var(--text-tertiary);
      font-size: 11.5px;
      display: block;
      line-height: 28px;
      padding-top: 0;
      padding-bottom: 0;
    }
    .pl-cell--link {
      cursor: pointer;
    }
    .pl-row:hover .pl-cell--link {
      color: var(--text-secondary);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .pl-cell--wide {
      grid-column: span 2;
    }
    .pl-cell--actions {
      padding: 3px var(--pl-gutter);
      gap: 4px;
      justify-content: flex-end;
    }
    .pl-row[data-kind="stop"] .pl-cell--name,
    .pl-row[data-kind="note"] .pl-cell--name,
    .pl-row[data-kind="obs"] .pl-cell--name {
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .pl-row[data-kind="stop"] .pl-cell--name { color: var(--danger); }
    .pl-row[data-kind="note"] .pl-cell--name { color: var(--note); }
    .pl-row[data-kind="obs"] .pl-cell--name { color: var(--accent); }
    .pl-row[data-kind="stop"] .pl-cell--type,
    .pl-row[data-kind="note"] .pl-cell--type,
    .pl-row[data-kind="obs"] .pl-cell--type {
      color: inherit;
    }
    .pl-row[data-kind="stop"] .pl-cell:first-child::before,
    .pl-row[data-kind="note"] .pl-cell:first-child::before,
    .pl-row[data-kind="obs"] .pl-cell:first-child::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      z-index: 2;
    }
    .pl-row[data-kind="stop"] .pl-cell:first-child::before { background: var(--danger); }
    .pl-row[data-kind="note"] .pl-cell:first-child::before { background: var(--note); }
    .pl-row[data-kind="obs"] .pl-cell:first-child::before { background: var(--accent); }

    .pl-row:hover .pl-cell {
      background-image: linear-gradient(rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.05));
    }
    .pl-row[data-kind="stop"] .pl-cell {
      background-color: rgba(255, 91, 91, 0.14);
    }
    .pl-row[data-kind="note"] .pl-cell {
      background-color: rgba(199, 164, 255, 0.12);
    }
    .pl-row[data-kind="obs"] .pl-cell {
      background-color: rgba(76, 194, 255, 0.12);
    }
    .pl-row[data-corrupt="1"] .pl-cell,
    .pl-row[data-warn="unsupported"] .pl-cell {
      background-color: rgba(255, 91, 91, 0.12);
    }
    .pl-row[data-state="next"] .pl-cell {
      background-color: #262219;
    }
    .pl-row[data-state="onair"] .pl-cell {
      background-color: #1f2e27;
    }
    .pl-row[data-state="next"] .pl-cell:first-child::before,
    .pl-row[data-state="onair"] .pl-cell:first-child::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      z-index: 2;
    }
    .pl-row[data-state="next"] .pl-cell:first-child::before {
      background: var(--warning);
    }
    .pl-row[data-state="onair"] .pl-cell:first-child::before {
      background: var(--success);
    }
    .pl-row[data-state="onair"][data-live="0"] .pl-cell:first-child::before {
      background: repeating-linear-gradient(180deg, var(--success) 0 5px, transparent 5px 10px);
    }
    .pl-row[data-kind="stop"][data-state="onair"] .pl-cell:first-child::before,
    .pl-row[data-kind="stop"][data-state="next"] .pl-cell:first-child::before {
      background: var(--danger);
    }
    .pl-row[data-kind="note"][data-state="onair"] .pl-cell:first-child::before,
    .pl-row[data-kind="note"][data-state="next"] .pl-cell:first-child::before {
      background: var(--note);
    }
    .pl-row[data-kind="obs"][data-state="onair"] .pl-cell:first-child::before,
    .pl-row[data-kind="obs"][data-state="next"] .pl-cell:first-child::before {
      background: var(--accent);
    }
    .pl-row[data-state="onair"] {
      outline: 1px solid rgba(74, 222, 128, 0.55);
      outline-offset: -1px;
    }
    .pl-row[data-state="next"] {
      outline: 1px solid rgba(224, 179, 65, 0.5);
      outline-offset: -1px;
    }
    .pl-row[data-selected="1"] .pl-cell {
      background-image: linear-gradient(var(--accent-soft), var(--accent-soft));
    }
    .pl-row[data-selected="1"]:hover .pl-cell {
      background-image: linear-gradient(var(--accent-soft), var(--accent-soft)),
                        linear-gradient(rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.05));
    }
    .pl-row[data-selected="1"] {
      outline: 1px solid rgba(76, 194, 255, 0.85);
      outline-offset: -1px;
    }
    .pl-row[data-past="1"] {
      opacity: 0.5;
    }
    .pl-row[data-dragging="1"] {
      opacity: 0.4;
      cursor: grabbing;
    }

    .pl-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-quaternary);
      flex-shrink: 0;
    }
    .pl-row[data-kind="stop"] .pl-dot { background: var(--danger); }
    .pl-row[data-kind="note"] .pl-dot { background: var(--note); }
    .pl-row[data-kind="obs"] .pl-dot { background: var(--accent); }
    .pl-row[data-state="onair"] .pl-dot {
      background: var(--success);
    }
    .pl-row[data-state="onair"][data-live="1"] .pl-dot {
      box-shadow: 0 0 0 3px var(--success-soft);
    }
    .pl-row[data-warn="warn"] .pl-dot { background: var(--warning); }
    .pl-row[data-warn="unsupported"] .pl-dot { background: var(--danger); }
    .pl-row[data-corrupt="1"] .pl-dot { background: var(--danger); }

    .pl-spin {
      width: 12px;
      height: 12px;
      border: 2px solid var(--stroke-strong);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      flex-shrink: 0;
    }

    .pl-act {
      background: var(--bg-layer-3);
      border: 1px solid var(--stroke-strong);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      padding: 0 8px;
      min-height: 22px;
      min-width: 28px;
      font-size: 10.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pl-act[data-active="1"] {
      background: var(--accent-soft);
      border-color: rgba(76, 194, 255, 0.5);
      color: var(--accent-hover);
    }
    .pl-act--danger {
      color: var(--text-tertiary);
    }
    .pl-act--danger:hover {
      background: var(--danger-soft);
      border-color: rgba(255, 91, 91, 0.4);
      color: var(--danger-text);
    }

    .pl-follow {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--stroke-strong);
      background: var(--bg-layer-3);
      color: var(--text-tertiary);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }
    .pl-follow[data-active="1"] {
      background: var(--accent-soft);
      border-color: rgba(76, 194, 255, 0.5);
      color: var(--accent-hover);
    }

    .log-head {
      background: var(--bg-layer-2);
      transition: background 0.12s ease;
    }
    .log-head:hover {
      background: var(--bg-layer-3);
    }

    .pl-menu-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 32px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 12px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>
</html>
